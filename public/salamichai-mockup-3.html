<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ঈদ সালামি কুইজ - ফলাফল</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-container {
            max-width: 500px;
            width: 100%;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .result-emoji {
            text-align: center;
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .certificate {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border-top: 5px solid #FFD700;
            border-bottom: 5px solid #FFD700;
        }
        .certificate::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255, 215, 0, 0.03) 10px, rgba(255, 215, 0, 0.03) 20px);
            pointer-events: none;
        }
        .certificate-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .cert-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }
        .cert-subtitle {
            font-size: 12px;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .cert-detail {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }
        .cert-detail strong {
            color: #333;
            display: block;
            margin-bottom: 3px;
        }
        .salamia-amount {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin: 25px 0;
            text-align: center;
        }
        .amount-label {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .amount-value {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .amount-currency {
            font-size: 14px;
            opacity: 0.9;
        }
        .score-detail {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }
        .screenshot-note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            color: #856404;
            line-height: 1.6;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-screenshot {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-screenshot:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-share {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        .btn-share:hover {
            border-color: #667eea;
            color: #667eea;
        }
        .attempt-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <div class="result-emoji">🎉</div>

        <div class="certificate">
            <div class="attempt-badge">1ST ATTEMPT</div>
            
            <div class="certificate-content">
                <div class="cert-title">সালামি সার্টিফিকেট</div>
                <div class="cert-subtitle">ঈদ ২০২৬</div>

                <div class="cert-detail">
                    <strong>প্রদানকারী:</strong>
                    রহিম ভাই
                </div>

                <div class="cert-detail">
                    <strong>প্রাপক:</strong>
                    আহমেদ
                </div>

                <div class="salamia-amount">
                    <div class="amount-label">আপনার সালামি</div>
                    <div class="amount-value">৪৩০</div>
                    <div class="amount-currency">টাকা 💵</div>
                </div>

                <div class="score-detail">
                    ১৭/২০ সঠিক উত্তর • ৮৫%
                </div>

                <div class="screenshot-note">
                    📸 এই পেজের স্ক্রিনশট নিয়ে রহিম ভাই কে দেখান! এটিই আপনার সালামির প্রমাণ। 🎁
                </div>

                <div class="action-buttons">
                    <button class="btn-screenshot">📱 স্ক্রিনশট নিন</button>
                    <button class="btn-share">🔗 শেয়ার করুন</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

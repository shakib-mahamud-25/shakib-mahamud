<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ঈদ সালামি কুইজ - Salamichai</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary-cta: #FF8C42;
            --accent: #F9C784;
            --heading-white: #FFFFFF;
            --secondary-text: #E0E0E0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Noto Serif Bengali', 'Crimson Text', serif;
            background: linear-gradient(135deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.6) 100%),
                        url('https://raw.githubusercontent.com/howfunnyproject/salamichai/main/background.jpg') center/cover no-repeat;
            background-attachment: scroll;
            background-size: cover;
            color: #1a1f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        .poster-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .poster {
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(15px);
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .poster-emoji {
            font-size: 2.2rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            line-height: 1;
        }
        
        .poster-title {
            font-family: 'Crimson Text', serif;
            font-size: 1.4rem;
            color: var(--heading-white);
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
            line-height: 1.1;
        }
        
        .poster-subtitle {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.75);
            margin: 0;
            line-height: 1.2;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .features-mini {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        
        .feature-badge {
            background: rgba(255, 140, 66, 0.2);
            border: 0.5px solid rgba(255, 140, 66, 0.4);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.5rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        .cta-button-mini {
            background: linear-gradient(135deg, var(--primary-cta) 0%, #FF7020 100%);
            color: #000;
            padding: 4px 12px;
            border-radius: 3px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.55rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 6px;
            box-shadow: 0 2px 8px rgba(255, 140, 66, 0.2);
            letter-spacing: 0.3px;
        }
        
        .cta-button-mini:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 140, 66, 0.3);
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="poster">
            <div class="poster-emoji">⭐🌙</div>
            
            <h1 class="poster-title">Salamichai</h1>
            
            <p class="poster-subtitle">ঈদ সালামি কুইজ</p>
            
            <div class="features-mini">
                <span class="feature-badge">🎯 Smart</span>
                <span class="feature-badge">💚 Share</span>
                <span class="feature-badge">🏆 Fun</span>
            </div>
            
            <button class="cta-button-mini">Live Demo →</button>
        </div>
    </div>
</body>
</html>

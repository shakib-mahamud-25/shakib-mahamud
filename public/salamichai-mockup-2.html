<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ঈদ সালামি কুইজ - প্রশ্ন</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            max-width: 600px;
            margin: 40px auto;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .quiz-header {
            background: white;
            border-radius: 15px 15px 0 0;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .quiz-header h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .quiz-header p {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 35%;
            transition: width 0.3s ease;
        }
        .quiz-content {
            background: white;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .question-counter {
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .current-question {
            font-size: 18px;
            color: #333;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .option-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .option-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .quiz-footer {
            display: flex;
            gap: 12px;
            padding: 20px 25px;
            background: #f5f5f5;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-prev {
            background: white;
            border: 2px solid #e0e0e0;
            color: #333;
        }
        .btn-prev:hover {
            border-color: #667eea;
            color: #667eea;
        }
        .btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }
        .receiver-name-input {
            margin-top: 20px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
            display: none;
        }
        .receiver-name-input.show {
            display: block;
        }
        .receiver-name-input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h2>রহিম ভাই এর সালামি কুইজ</h2>
            <p>ঈদের শুভেচ্ছা জানাই। নিচের প্রশ্ন গুলোর উত্তর দাও এবং রহিম ভাইয়ের তরফ থেকে সালামি বুঝে নাও।</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="quiz-content">
            <div class="question-counter">প্রশ্ন ৭ / ২০</div>
            <div class="current-question">
                আমি হঠাৎ চুপ হয়ে গেলে সাধারণত তার মানে—
            </div>

            <div class="options-container">
                <button class="option-btn">ভাবছি</button>
                <button class="option-btn">রাগ করেছি</button>
                <button class="option-btn selected">ক্লান্ত</button>
                <button class="option-btn">সবকিছু বিশ্লেষণ করছি</button>
            </div>

            <input type="text" class="receiver-name-input" placeholder="আপনার নাম লিখুন">
        </div>

        <div class="quiz-footer">
            <button class="btn-prev" disabled>← পূর্ববর্তী</button>
            <button class="btn-next">পরবর্তী →</button>
        </div>
    </div>
</body>
</html>
